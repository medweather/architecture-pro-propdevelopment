apiVersion: v1
kind: Pod
metadata:
  name: pod-secure
  namespace: audit-zone
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginx
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: temp-volume
          mountPath: /data
  volumes:
    - name: temp-volume
      emptyDir: {}
