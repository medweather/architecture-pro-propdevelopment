apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsprunasnonroot
  annotations:
    description: Requires runAsNonRoot and readOnlyRootFilesystem
spec:
  crd:
    spec:
      names:
        kind: K8sPSPRunAsNonRoot
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsprunasnonroot

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          container := input_containers[_]
          not container.securityContext.runAsNonRoot == true
          msg := sprintf("Container %v должен иметь runAsNonRoot: true", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          container := input_containers[_]
          not container.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container %v должен иметь readOnlyRootFilesystem: true", [container.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
