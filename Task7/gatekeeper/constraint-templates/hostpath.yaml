apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphostpath
  annotations:
    description: Disallows hostPath volumes in Pods
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHostPath
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphostpath

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("Volume %v использует hostPath — hostPath запрещён", [volume.name])
        }
